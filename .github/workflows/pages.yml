name: Build and deploy Pocky Football

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday/Tuesday recap and Friday after Thursday games, 14:00 UTC.
    - cron: '0 14 * * 1,2,5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Resolve main when the serialized run starts, not the possibly old event SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report trigger
        run: echo "Trigger=${{ github.event_name }}; ESPN fetch requested=${{ github.event_name != 'push' }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            .cache/player-metadata
            .cache/player-games/participation
            .cache/player-games/game-status
          key: player-metadata-${{ github.run_id }}
          restore-keys: player-metadata-

      - name: Test exporter
        run: python -m unittest discover -s tests -v

      - name: Stage and validate current-season ESPN refresh
        id: refresh
        if: github.event_name != 'push'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          if [[ -z "$ESPN_S2" || -z "$SWID" ]]; then
            echo "Required ESPN_S2 / SWID secrets are missing." >&2
            exit 1
          fi
          python data_refresh.py refresh

      - name: Validate release JSON
        id: validation
        run: python data_refresh.py validate

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test and build frontend
        working-directory: frontend
        run: |
          pnpm test
          pnpm build

      - name: Persist validated snapshots
        id: persistence
        if: github.event_name != 'push'
        run: python data_refresh.py persist

      - name: Reject outdated checkouts or public data rollback
        id: guard
        run: python data_refresh.py guard

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public generation and source JSON
        id: verification
        if: hashFiles('frontend/public/data/pocky-football/refresh.json') != ''
        run: python data_refresh.py verify

      - name: Report release outcome
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          REFRESH: ${{ steps.refresh.outcome }}
          VALIDATION: ${{ steps.validation.outcome }}
          PERSISTENCE: ${{ steps.persistence.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          DEPLOYMENT: ${{ steps.deployment.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          path = pathlib.Path('frontend/public/data/pocky-football/refresh.json')
          meta = json.loads(path.read_text()) if path.exists() else {}
          lines = ['## Data release', f"Commit used: {revision}",
                   f"Generation: {meta.get('generationId', 'legacy snapshot; first refresh pending')}",
                   f"Last persisted ESPN fetch: {meta.get('lastSuccessfulEspnFetchAt', 'unknown')}"]
          lines += [f'{key}: {os.environ[key]}' for key in
                    ('TRIGGER', 'REFRESH', 'VALIDATION', 'PERSISTENCE', 'GUARD', 'DEPLOYMENT', 'VERIFICATION')]
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n\n'.join(lines) + '\n')
          PY
